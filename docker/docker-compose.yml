version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dosadriver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-dosadriver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-dosadriver}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # Only expose locally — never to public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosadriver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (for rate limiting / caching) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dosadriver-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ../Backend
      dockerfile: ../Backend/Dockerfile
    container_name: dosadriver-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV:                production
      PORT:                    8080
      DATABASE_URL:            postgresql://${POSTGRES_USER:-dosadriver}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dosadriver}
      REDIS_URL:               redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}      # base64 encoded JSON
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS:-https://yourdomain.com}
      GOOGLE_MAPS_API_KEY:     ${GOOGLE_MAPS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dosadriver-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
